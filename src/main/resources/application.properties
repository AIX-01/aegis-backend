spring.application.name=aegis-backend

# ==================== Database ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aegis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==================== Redis ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ==================== AWS S3 ====================
aws.s3.access-key=${AWS_S3_ACCESS_KEY:your-access-key}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:your-secret-key}
aws.s3.region=${AWS_S3_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:aegis-clips}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==================== CORS ====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ==================== MediaMTX ====================
mediamtx.api-url=${MEDIAMTX_API_URL:http://localhost:9997}

# ==================== Admin Initialization ====================
admin.email=${ADMIN_EMAIL:admin@aegis.local}
admin.password=${ADMIN_PASSWORD:admin123}
admin.name=${ADMIN_NAME:Administrator}
